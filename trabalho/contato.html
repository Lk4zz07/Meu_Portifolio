
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Head Healthy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        href="css/style.css" rel="stylesheet"
    >
</head>

<body >

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
              Head Healthy
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir ou fechar o menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="galeria.html">Galeria</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dados.html">Dados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1" style="max-width: 600px;">

        <h1 class="text-center fw-bold text-success mb-3">
            Fale Conosco
        </h1>

        <p class="text-center text-muted mb-4">
            Caso precise de canais de suporte ou queira sugerir conteúdos
            adicionais, envie sua mensagem.
        </p>

        <form
            class="p-4 bg-white border rounded shadow-sm"
            action="#"
            method="post"
            onsubmit="event.preventDefault(); alert('Este formulário é demonstrativo e ainda não envia mensagens.');"
        >

            <div class="mb-3">
                <label for="inputNome" class="form-label fw-bold">
                    Nome Completo
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="inputNome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="inputEmail" class="form-label fw-bold">
                    Endereço de E-mail
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="inputEmail"
                    name="email"
                    placeholder="nome@exemplo.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="selectAssunto" class="form-label fw-bold">
                    Assunto
                </label>

                <select
                    class="form-select"
                    id="selectAssunto"
                    name="assunto"
                >
                    <option value="habitos" selected>
                        Dúvidas sobre os Hábitos
                    </option>
                    <option value="profissionais">
                        Indicação de Profissionais
                    </option>
                    <option value="sugestoes">
                        Sugestões de Melhoria
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="textMensagem" class="form-label fw-bold">
                    Sua Mensagem
                </label>

                <textarea
                    class="form-control"
                    id="textMensagem"
                    name="mensagem"
                    rows="4"
                    placeholder="Escreva detalhadamente..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                Enviar Formulário
            </button>

        </form>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 text-secondary">
                &copy; 4ª Atividade de Desenvolvimento Front-end
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
